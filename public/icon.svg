<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zenith">
  <defs>
    <linearGradient id="peak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b5bdb" />
      <stop offset="1" stop-color="#6f8bff" />
    </linearGradient>
    <radialGradient id="zenit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaf0ff" />
      <stop offset="1" stop-color="#9db0ff" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0e1116" />
  <!-- vetta secondaria (profondità) -->
  <path d="M288 392 L356 264 L424 392 Z" fill="#3b5bdb" fill-opacity="0.55" />
  <!-- vetta principale -->
  <path d="M96 392 L240 152 L384 392 Z" fill="url(#peak)" />
  <!-- sfaccettatura chiara a sinistra -->
  <path d="M240 152 L240 392 L96 392 Z" fill="#ffffff" fill-opacity="0.12" />
  <!-- punto allo zenit -->
  <circle cx="240" cy="104" r="24" fill="url(#zenit)" />
</svg>
